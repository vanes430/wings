name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - "*"
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build release binary
        env:
          CGO_ENABLED: 0
        run: |
          # Generate version in DDMMYY-hash format
          RELEASE_VERSION=$(date +'%d%m%y')-$(git rev-parse --short HEAD)
          echo "Building version: $RELEASE_VERSION"
          GOOS=linux GOARCH=amd64 go build -o wings -v -trimpath -ldflags="-s -w -X vanes430/wings/system.Version=$RELEASE_VERSION" wings.go
          chmod +x wings

      - name: Create Automatic Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "Latest Build"
          files: |
            wings
